AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Sabin Shrestha Portfolio — single EC2 instance running nginx, serving the
  site cloned directly from GitHub. No Docker, no registry, nothing to build
  or push beforehand. Deliberately ephemeral: no Elastic IP, nothing to
  preserve — delete the stack and create it again fresh any time (e.g. each
  time you start a new AWS Academy Learner Lab session).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network
        Parameters:
          - VpcId
          - SubnetId
      - Label:
          default: Instance
        Parameters:
          - InstanceType
          - InstanceProfileName
      - Label:
          default: Site source
        Parameters:
          - RepoUrl
          - RepoBranch
      - Label:
          default: Optional SSH access
        Parameters:
          - KeyName
          - SSHLocation
    ParameterLabels:
      VpcId:
        default: "VPC (pick the default one)"
      SubnetId:
        default: "Subnet (any public subnet in that VPC)"
      InstanceProfileName:
        default: "IAM instance profile name (e.g. LabInstanceProfile)"
      RepoUrl:
        default: "Public GitHub repo URL to clone"

Parameters:
  ProjectName:
    Type: String
    Default: sabin-portfolio

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Choose the account's default VPC.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Choose any subnet inside the VPC above.

  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues: [t2.micro, t3.micro]

  LatestAmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
    Description: Resolved automatically to the latest Amazon Linux 2023 AMI — leave as-is.

  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: >
      Name of an EXISTING IAM instance profile (AWS Academy Learner Lab
      accounts can't create new IAM roles). Check IAM → Roles for the exact
      name if unsure. Must include SSM permissions (Learner Lab's default
      role usually does) — the deploy-aws.yml CI/CD workflow uses SSM to
      redeploy on every push.

  RepoUrl:
    Type: String
    Description: e.g. https://github.com/Sabinxtha60/sabin-portfolio.git

  RepoBranch:
    Type: String
    Default: main

  KeyName:
    Type: String
    Default: ""
    Description: Optional existing EC2 key pair name. Leave blank to skip SSH entirely.

  SSHLocation:
    Type: String
    Default: "0.0.0.0/0"
    Description: CIDR allowed to reach port 22 (only used if KeyName is set). Restrict this to your own IP.

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} - allow HTTP (and optional SSH)"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - !If
          - HasKeyName
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref SSHLocation
            Description: SSH (restricted)
          - !Ref "AWS::NoValue"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-web-sg"

  WebInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      IamInstanceProfile: !Ref InstanceProfileName
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Ref ProjectName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y nginx git
          systemctl enable --now nginx

          # Persistent clone (not /tmp) so later redeploys can just `git pull`
          # instead of re-cloning from scratch.
          git clone --branch "${RepoBranch}" "${RepoUrl}" /opt/site

          # The redeploy script CI/CD calls on every push (see
          # .github/workflows/deploy-aws.yml) — pulls latest, republishes,
          # reloads nginx. Kept on the box so both first-boot and every
          # later redeploy run the exact same logic.
          cat > /usr/local/bin/deploy-site.sh <<'SCRIPT'
          #!/bin/bash
          set -euxo pipefail
          cd /opt/site
          git fetch origin "${RepoBranch}"
          git reset --hard "origin/${RepoBranch}"
          rm -rf /usr/share/nginx/html/*
          cp -r /opt/site/index.html /opt/site/css /opt/site/js /opt/site/assets /usr/share/nginx/html/ 2>/dev/null || true
          chown -R nginx:nginx /usr/share/nginx/html
          systemctl reload nginx
          SCRIPT
          chmod +x /usr/local/bin/deploy-site.sh

          /usr/local/bin/deploy-site.sh

Outputs:
  InstanceId:
    Description: EC2 instance ID
    Value: !Ref WebInstance

  PublicIP:
    Description: Public IP (changes if the instance is ever replaced/restarted without an EIP)
    Value: !GetAtt WebInstance.PublicIp

  SiteURL:
    Description: Open this once the stack finishes creating (give nginx ~1-2 minutes after that to clone + start)
    Value: !Sub "http://${WebInstance.PublicIp}"
