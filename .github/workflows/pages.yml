name: Deploy to GitHub Pages

# This is the PERMANENT, always-on host for the portfolio — free, no AWS
# session limits, deploys automatically on every push to main. Keep this
# running alongside deploy-aws.yml, which is a separate, session-bound
# redeploy of the EC2/nginx demo.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage only the public site files
        # Deliberately NOT publishing the whole repo root — Dockerfile,
        # infra/, aws/*.json etc. don't need to be served on the live site.
        # Same fileset the Dockerfile itself copies into the nginx image.
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js assets _site/

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
