name: Deploy to Server

# Based on the pipeline provided in class: build the Docker image, push it
# to Docker Hub, then SSH into the EC2 instance (infra/cloudformation/ec2.yaml)
# to pull and restart it. No AWS SDK/credentials involved at all here — only
# a Docker Hub token and an SSH key, so none of the AWS Academy Learner Lab
# credential-rotation problems apply to this pipeline.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ vars.SERVER_IP }} # Repository VARIABLE (not secret) — Settings → Secrets and variables → Actions → Variables

    steps:
      - uses: actions/checkout@v4

      - name: "Build and push Docker image"
        run: |
          echo "$DOCKERHUB_PAT" | docker login -u sabinxtha60 --password-stdin
          docker build -t sabinxtha60/sabin-portfolio .
          docker push sabinxtha60/sabin-portfolio
        env:
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}

      - name: "Configure SSH"
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf 'Host *\n\tStrictHostKeyChecking no\n\n' > ~/.ssh/config
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: "Decode SSH key"
        run: |
          touch pem.pem
          echo "$SSH_KEY64" | base64 -d > pem.pem && chmod 400 pem.pem
          ssh-keygen -R "$SERVER_IP" || true
        env:
          SSH_KEY64: ${{ secrets.SSH_KEY64 }}

      - name: "Pull latest image and restart the container"
        run: |
          ssh -t ubuntu@$SERVER_IP -i pem.pem 'docker pull sabinxtha60/sabin-portfolio'
          ssh -t ubuntu@$SERVER_IP -i pem.pem 'docker stop sabin-portfolio-site || true; docker rm sabin-portfolio-site || true'
          ssh -t ubuntu@$SERVER_IP -i pem.pem 'docker run --name sabin-portfolio-site -p 80:80 -d sabinxtha60/sabin-portfolio'
