name: Deploy to AWS EC2

# Redeploys the CloudFormation-managed EC2 instance (infra/cloudformation/ec2-nginx.yaml)
# whenever main changes: finds the running instance via the stack's outputs,
# then uses AWS Systems Manager to tell it to `git pull` + reload nginx —
# no SSH, no OIDC/IAM role creation required (AWS Academy Learner Lab
# accounts can't create those anyway).
#
# This pipeline only works while your Learner Lab session is active. If the
# lab isn't running (stack doesn't exist / instance is stopped), the job
# exits cleanly instead of failing — that's expected, not an error. See the
# README's Learner Lab notes for why this can't be a fully unattended
# pipeline the way the GitHub Pages one is.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1        # change if your lab uses a different region
  CFN_STACK_NAME: sabin-portfolio

jobs:
  deploy:
    if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.AWS_SESSION_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (Learner Lab session tokens)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the running instance from the CloudFormation stack
        id: lookup
        run: |
          set +e
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "$CFN_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text 2>/dev/null)
          set -e

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No '$CFN_STACK_NAME' stack found — Learner Lab is probably not running right now."
            echo "This is expected when the lab is stopped; nothing to deploy to."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found instance: $INSTANCE_ID"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the instance to be registered with SSM
        if: steps.lookup.outputs.found == 'true'
        run: |
          for i in $(seq 1 10); do
            STATE=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.lookup.outputs.instance_id }}" \
              --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null)
            if [ "$STATE" = "Online" ]; then
              echo "SSM agent online."
              exit 0
            fi
            echo "Waiting for SSM agent (attempt $i/10)..."
            sleep 10
          done
          echo "Instance never came online in SSM — it may still be booting for the first time. Try again shortly."
          exit 1

      - name: Redeploy via SSM (git pull + reload nginx)
        if: steps.lookup.outputs.found == 'true'
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.lookup.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Redeploy sabin-portfolio (${{ github.sha }})" \
            --parameters '{"commands":["/usr/local/bin/deploy-site.sh"]}' \
            --query "Command.CommandId" --output text)

          echo "Sent command $CMD_ID, waiting for it to finish..."
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.lookup.outputs.instance_id }}" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.lookup.outputs.instance_id }}" \
            --query "Status" --output text)

          echo "--- deploy-site.sh output ---"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.lookup.outputs.instance_id }}" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "--- error output ---"
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ steps.lookup.outputs.instance_id }}" \
              --query "StandardErrorContent" --output text
            echo "Redeploy failed with status: $STATUS"
            exit 1
          fi

          echo "Redeployed successfully."
